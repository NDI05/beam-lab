<!doctype html>
<html lang="id">
  <head>

    <meta name="theme-color" content="#e8efef" />

    <link rel="stylesheet" href="../styles.css" />

  <body>
    <div class="app-shell v2-shell">

          <span class="brand-name">beam<span>lab</span></span>
        </a>
        <div class="course-label">Studio teknik sipil <span>·</span> versi 2.5</div>
        <nav class="primary-nav" aria-label="Menu utama">
          <button class="nav-item is-active" id="nav-map" type="button" data-action="go-map" aria-current="page">

            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0M4 6h16"/></svg><span>Debit air</span>

        </nav>
        <div class="journey-block">
          <div class="journey-heading"><span>Perjalananmu</span><span class="level-name" id="level-name">Pengamat</span></div>
          <div class="journey-track" aria-hidden="true"><span id="journey-fill"></span></div>
          <div class="journey-caption"><span id="journey-count">0 dari 5 misi</span><span id="journey-percent">0%</span></div>
        </div>
        <div class="side-list-heading">Jalur belajar</div>
        <div class="side-missions" id="side-missions"></div>
        <div class="sidebar-bottom"><span class="status-dot" aria-hidden="true"></span><span>V2.5 · ilustrasi konseptual</span></div>

          <div class="breadcrumb"><span>Teknik sipil</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Peta misi</strong></div>
          <div class="topbar-actions">
            <details class="version-menu">
              <summary>Versi 2.5 <span aria-hidden="true">⌄</span></summary>
              <div class="version-options" aria-label="Pilih versi Beam Lab">

                <a href="../v2.0/index.html">2.0 · jembatan 2D</a>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
