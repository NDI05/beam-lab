<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e8efef" />
    <meta name="description" content="Beam Lab — belajar membaca perilaku balok lewat eksperimen interaktif." />
    <title>Beam Lab — Studio struktur v1.0</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navigasi Beam Lab">
        <a class="brand" href="#home" data-action="go-map" aria-label="Beam Lab, kembali ke peta misi">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 42 42" fill="none">
              <path d="M5 12h32M9 12v19m24-19v19M5 31h32" stroke="currentColor" stroke-width="1.5" />
              <path d="M10 12c3 0 4 12 11 12s8-12 11-12" stroke="#177d85" stroke-width="2.4" />
              <path d="M21 4v6m-2-2 2 2 2-2" stroke="#dd7445" stroke-width="1.5" />
            </svg>
          </span>
          <span class="brand-name">beam<span>lab</span></span>
        </a>

        <div class="course-label">Studio struktur <span>·</span> versi 1.0</div>

        <nav class="primary-nav" aria-label="Menu utama">
          <button class="nav-item is-active" id="nav-map" type="button" data-action="go-map" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5 9 3l6 2.5L20 3v15.5L15 21l-6-2.5L4 21V5.5Z"/><path d="M9 3v15.5M15 5.5V21"/></svg>
            <span>Peta misi</span>
          </button>
          <button class="nav-item" id="nav-lab" type="button" data-action="go-lab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M5 15c2.5 0 3-8 7-8s4.5 8 7 8"/><path d="M4 5v14M20 5v14"/></svg>
            <span>Meja eksperimen</span>
          </button>
        </nav>

        <div class="journey-block">
          <div class="journey-heading">
            <span>Perjalananmu</span>
            <span class="level-name" id="level-name">Pengamat</span>
          </div>
          <div class="journey-track" aria-hidden="true"><span id="journey-fill"></span></div>
          <div class="journey-caption"><span id="journey-count">0 dari 5 misi</span><span id="journey-percent">0%</span></div>
        </div>

        <div class="side-list-heading">Jalur belajar</div>
        <div class="side-missions" id="side-missions"></div>

        <div class="sidebar-bottom">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Progres tersimpan di perangkat ini</span>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Mekanika bahan</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Peta misi</strong></div>
          <div class="topbar-actions">
            <div class="xp-chip" aria-label="Poin pengalaman"><span class="xp-spark" aria-hidden="true">✳</span><strong id="xp-total">0</strong><span>XP</span></div>
            <button class="text-button" type="button" data-action="reset-progress">Mulai ulang progres</button>
          </div>
        </header>

        <div class="screen-container" id="screen-container" tabindex="-1"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
